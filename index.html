  <body>
    <div id="root"></div>
    <script>
      /* ===== 运行时DOM修改脚本 ===== */
      let lastRoute = '';

      function detectRoute() {
        const shell = document.querySelector('.site-shell');
        if (!shell) return '';
        const cls = shell.className.toString();
        if (cls.indexOf('route-course') >= 0) return 'course';
        if (cls.indexOf('route-points') >= 0) return 'points';
        if (cls.indexOf('route-school') >= 0) return 'school';
        if (cls.indexOf('route-leaderboard') >= 0) return 'leaderboard';
        if (cls.indexOf('route-favorites') >= 0) return 'favorites';
        if (cls.indexOf('route-likes') >= 0) return 'likes';
        return 'other';
      }

      function runModifications() {
        applyNavMods();
        const route = detectRoute();
        if (route === lastRoute && route !== '') {
          // 同一路由，检查是否已应用
          if (route === 'course' && document.querySelector('.topline-merged')) return;
          if (route === 'points' && document.querySelector('.points-arranged')) return;
          if ((route === 'favorites' || route === 'likes') && document.querySelector('.library-arranged')) return;
        }
        lastRoute = route;

        if (route === 'course') applyCourseMods();
        else if (route === 'points') applyPointsMods();
        else if (route === 'school') applySchoolMods();
        else if (route === 'favorites' || route === 'likes') applyLibraryMods();
      }

      /* ===== 课程详情页修改 ===== */
      function applyCourseMods() {
        const topLine = document.querySelector('.detail-topline');
        const author = document.querySelector('.detail-author');
        const eyebrow = topLine?.querySelector('.eyebrow');

        if (!topLine || !author || !eyebrow) {
          setTimeout(applyCourseMods, 150);
          return;
        }

        // 避免重复应用
        if (document.querySelector('.topline-merged')) return;

        // 1. 文案修改
        eyebrow.textContent = eyebrow.textContent.replace('AI Builder School', 'From');

        // 1b. "返回 School" 改为 "更多"
        const courseBackBtn = topLine.querySelector('.back');
        if (courseBackBtn) {
          const textNodes = Array.from(courseBackBtn.childNodes).filter(
            n => n.nodeType === 3
          );
          if (textNodes.length > 0) {
            textNodes[0].textContent = '更多';
            for (let i = 1; i < textNodes.length; i++) textNodes[i].remove();
          }
        }

        // 1c. 删除标题区内冗余的 detail-author（作者信息已在 topline 展示）
        const headingAuthor = document.querySelector('.detail-heading .detail-author');
        if (headingAuthor) headingAuthor.remove();

        // 2. 合并作者信息（去掉45分钟时长，只保留日期）
        const avatarEl = author.querySelector('.avatar');
        const authorBtn = author.querySelector('button');
        const authorName = authorBtn?.textContent?.trim() || '';

        // 获取日期/时长文本，去掉时长部分
        const spans = author.querySelectorAll('span');
        let dateText = spans.length >= 2 ? spans[1].textContent.trim() : (spans[0]?.textContent?.trim() || '');
        // 去掉 "· 45分钟" 这类时长信息
        dateText = dateText.replace(/\s*·\s*\d+分钟\s*/g, '').trim();
        dateText = dateText.replace(/\d+分钟/g, '').trim();
        // 如果只剩分隔符，清空
        if (/^[·\s]+$/.test(dateText)) dateText = '';

        const merged = document.createElement('span');
        merged.className = 'topline-merged';
        merged.dataset.applied = 'true';
        merged.innerHTML =
          (avatarEl ? `<span class="tm-avatar">${avatarEl.textContent.trim()}</span>` : '') +
          `<button class="tm-author-btn">${authorName}</button>` +
          (dateText ? `<span class="tm-meta">${dateText}</span>` : '');

        eyebrow.parentNode.insertBefore(merged, eyebrow.nextSibling);

        // 3. 删除页码 "1 / 5"
        const readingHead = document.querySelector('.reading-head');
        if (readingHead) {
          const headDiv = readingHead.querySelector(':scope > div');
          if (headDiv) {
            const spans = headDiv.querySelectorAll('span');
            spans.forEach(s => {
              if (/^\d+\s*\/\s*\d+$/.test(s.textContent.trim())) {
                s.remove();
              }
            });
          }
        }
      }

      /* ===== 我的积分页修改 ===== */
      function applyPointsMods() {
        const main = document.querySelector('main.page.points');
        if (!main) {
          setTimeout(applyPointsMods, 150);
          return;
        }
        if (main.querySelector('.points-arranged')) return;

        main.classList.add('points-arranged');

        // 确保返回排行榜在最顶部
        const backBtn = main.querySelector(':scope > .back');
        if (backBtn) {
          main.insertBefore(backBtn, main.firstChild);
        }

        // 把 points-stats（互动指数）移到 page-title（我的积分）后面，积分流水前面
        const titleEls = main.querySelectorAll('.page-title');
        const pointsStats = main.querySelector('.points-stats');
        if (titleEls.length >= 2 && pointsStats) {
          const firstTitle = titleEls[0]; // 我的积分
          const secondTitle = titleEls[1]; // 积分流水
          // 把 stats 插入到 第一个title 和 第二个title 之间
          if (pointsStats.parentElement === main) {
            main.insertBefore(pointsStats, secondTitle);
          }
        }
      }

      /* ===== 全局修改：导航"Skill 共享"改为"Get Hub" ===== */
      function applyNavMods() {
        const navBtns = document.querySelectorAll('.header nav button, nav button');
        navBtns.forEach(btn => {
          if (btn.textContent.indexOf('Skill 共享') >= 0 && !btn.classList.contains('nav-gethub')) {
            btn.innerHTML = 'Get Hub';
            btn.classList.add('nav-gethub');
          }
        });
      }

      /* ===== School 页面修改 ===== */
      function applySchoolMods() {
        // School 主要靠 CSS 调整
      }

      /* ===== 我的收藏 / 我的点赞 页面修改 ===== */
      function applyLibraryMods() {
        const main = document.querySelector('main.page.library');
        if (!main) {
          setTimeout(applyLibraryMods, 150);
          return;
        }
        if (main.querySelector('.library-arranged')) return;
        main.classList.add('library-arranged');

        // "返回 School" 改为 "返回首页"
        const backBtn = main.querySelector(':scope > .back');
        if (backBtn) {
          const textNodes = Array.from(backBtn.childNodes).filter(
            n => n.nodeType === 3
          );
          if (textNodes.length > 0) {
            textNodes[0].textContent = ' 返回首页';
            for (let i = 1; i < textNodes.length; i++) {
              textNodes[i].remove();
            }
          } else {
            backBtn.appendChild(document.createTextNode(' 返回首页'));
          }
        }
      }

      /* ===== 用户菜单：普通员工视图 - 去掉往期精彩，新增"我的贡献" ===== */
      function applyUserMenuMods() {
        const menu = document.querySelector('.user-menu .menu');
        if (!menu || menu.querySelector('.menu-modified')) return;

        const items = menu.querySelectorAll(':scope > button, :scope > a');
        let pastBtn = null, adminLink = null;

        items.forEach(el => {
          const txt = el.textContent.trim();
          if (txt.indexOf('往期精彩') >= 0) pastBtn = el;
          if (txt.indexOf('管理后台') >= 0) adminLink = el;
        });

        // 删除"往期精彩"
        if (pastBtn) pastBtn.remove();

        // 在"我的点赞"后面添加"我的贡献"（用于 skill 共享模块）
        const likeBtn = Array.from(items).find(el => el.textContent.trim().indexOf('我的点赞') >= 0);
        if (likeBtn && !menu.querySelector('.my-contribution')) {
          const contrib = document.createElement('button');
          contrib.className = 'my-contribution';
          // 与原菜单项一致：文字在前，箭头 svg 在后
          contrib.innerHTML = '我的贡献' + likeBtn.querySelector('svg').outerHTML;
          likeBtn.parentNode.insertBefore(contrib, likeBtn.nextSibling);
        }

        menu.classList.add('menu-modified');
      }

      /* ===== 路由变化监听 ===== */
      function setupRouteWatcher() {
        const observer = new MutationObserver(() => {
          const route = detectRoute();
          if (route !== lastRoute || route === '') {
            setTimeout(runModifications, 100);
          }
          // 用户菜单随时可能打开
          if (document.querySelector('.user-menu .menu') && !document.querySelector('.user-menu .menu.menu-modified')) {
            setTimeout(applyUserMenuMods, 50);
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      // 启动
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          runModifications();
          setupRouteWatcher();
        });
      } else {
        runModifications();
        setupRouteWatcher();
      }
    </script>
  </body>
</html>
